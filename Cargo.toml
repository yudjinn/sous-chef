[package]
name = "sous-chef"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
ignore = "0.4.34"
regex = "1.13.1"
rmcp = { version = "3.10.0", features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "time", "sync", "signal"] }
toml = "1.2.1"
yaml-rust2 = "=0.13.0"

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"

[lints.clippy]
# Conventions from docs/architecture.md: no unwrap/expect outside tests, stubs never panic.
# Tests are exempt through clippy.toml; integration test files allow them explicitly.
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
