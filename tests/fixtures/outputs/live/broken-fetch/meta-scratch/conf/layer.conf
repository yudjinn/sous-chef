# T9.2 scratch layer: one recipe whose fetch must fail, for a real failed-task log.
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "scratch"
BBFILE_PATTERN_scratch = "^${LAYERDIR}/"
BBFILE_PRIORITY_scratch = "1"

LAYERDEPENDS_scratch = "core"
LAYERSERIES_COMPAT_scratch = "wrynose"
