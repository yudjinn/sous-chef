# Local configuration for the fixture build directory.
MACHINE ??= "qemux86"
DISTRO ?= "testdistro"

BB_NUMBER_THREADS ?= "4"
PARALLEL_MAKE ?= "-j 4"

# Per-recipe change in local.conf (org/recipe-change-in-local-conf).
EXTRA_OECONF:append:pn-hello = " --enable-local-debug"

# += on a variable that testdistro.conf later defaults with ?=: because local.conf is
# parsed first, the ?= default is lost (override/plus-equals-on-default).
DISTRO_FEATURES += "wayland"

CONF_VERSION = "2"
