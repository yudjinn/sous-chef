# A pre-honister layer, NOT listed in bblayers.conf. Written with "_" override syntax.
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "legacy"
BBFILE_PATTERN_legacy = "^${LAYERDIR}/"
BBFILE_PRIORITY_legacy = "7"

LAYERDEPENDS_legacy = "core"
LAYERSERIES_COMPAT_legacy = "dunfell"
