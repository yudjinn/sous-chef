#@TYPE: Machine
#@NAME: Board X (fixture stand-in BSP)
#@DESCRIPTION: An ARM board from the "socx" SoC family.

SOC_FAMILY = "socx"
# Adds the SoC family to the machine overrides, ahead of the machine name.
MACHINEOVERRIDES =. "socx:"

TARGET_ARCH = "arm"
MACHINE_FEATURES = "usbhost wifi"
KERNEL_IMAGETYPE = "zImage"
PREFERRED_PROVIDER_virtual/kernel ?= "linux-boardx"
