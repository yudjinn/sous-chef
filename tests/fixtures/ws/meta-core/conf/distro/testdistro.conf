DISTRO = "testdistro"
DISTRO_NAME = "Test Distro"
DISTRO_VERSION = "1.0"

DISTRO_FEATURES ?= "acl ipv4 ipv6 usbhost"

# Two recipes provide virtual/foo: libfoo (meta-core) and libfoo-alt (meta-vendor).
PREFERRED_PROVIDER_virtual/foo ?= "libfoo-alt"
PREFERRED_VERSION_libfoo-alt ?= "1.%"

TCLIBC ?= "glibc"

INHERIT += "sanityish"
