# Minimal stand-in for OE-Core's conf/bitbake.conf.

# Paths
TMPDIR ?= "${TOPDIR}/tmp"
DL_DIR ?= "${TOPDIR}/downloads"
WORKDIR = "${TMPDIR}/work/${MACHINE}/${PN}/${PV}"
BPN ?= "${PN}"
BP = "${BPN}-${PV}"
S = "${WORKDIR}/${BP}"
B = "${S}"
D = "${WORKDIR}/image"
T = "${WORKDIR}/temp"

prefix = "/usr"
exec_prefix = "${prefix}"
bindir = "${exec_prefix}/bin"
sbindir = "${exec_prefix}/sbin"
libdir = "${exec_prefix}/lib"
includedir = "${exec_prefix}/include"
datadir = "${prefix}/share"
sysconfdir = "/etc"

# Files and packages
FILESEXTRAPATHS ?= "__default:"
FILESPATH = "${@base_set_filespath(["${FILE_DIRNAME}/${BP}", "${FILE_DIRNAME}/${BPN}", "${FILE_DIRNAME}/files"], d)}"
PACKAGES = "${PN}-dbg ${PN}-dev ${PN}-doc ${PN}"
FILES:${PN} = "${bindir}/* ${sbindir}/* ${libdir}/lib*.so.*"
FILES:${PN}-dev = "${includedir} ${libdir}/lib*.so"
FILES:${PN}-doc = "${datadir}/doc"

# Overrides
TARGET_OS = "linux"
TARGET_ARCH ?= "i686"
TRANSLATED_TARGET_ARCH ??= "${TARGET_ARCH}"
MACHINEOVERRIDES ?= "${MACHINE}"
DISTROOVERRIDES ?= "${DISTRO}"
CLASSOVERRIDE ?= "class-target"
LIBCOVERRIDE ?= ":libc-glibc"
OVERRIDES = "${TARGET_OS}:${TRANSLATED_TARGET_ARCH}:pn-${PN}:layer-${FILE_LAYERNAME}:${MACHINEOVERRIDES}:${DISTROOVERRIDES}:${CLASSOVERRIDE}${LIBCOVERRIDE}:forcevariable"

# Build settings
EXTRA_OECONF ?= ""
EXTRA_OEMAKE ?= ""
CFLAGS ?= "-O2 -pipe"
LDFLAGS ?= "-Wl,-O1"

# Configuration files, in the order OE-Core includes them.
include conf/site.conf
include conf/auto.conf
include conf/local.conf
include conf/machine/${MACHINE}.conf
include conf/distro/${DISTRO}.conf
