# lint-precision: a `?=` default that is empty loses nothing. Trimmed from meta-poky
# (scarthgap) conf/distro/poky.conf:28 against OE-core bitbake.conf:905
# `DISTRO_EXTRA_RDEPENDS ?= ""`, and meta-yocto-bsp (kirkstone) beaglebone-yocto.conf:31
# against kernel.bbclass:232 `KERNEL_EXTRA_ARGS ?= ""` (here a class of the test).
DISTRO_EXTRA_RDEPENDS += "${POKY_DEFAULT_EXTRA_RDEPENDS}"
DISTRO_EXTRA_RDEPENDS ?= ""
KERNEL_EXTRA_ARGS += "LOADADDR=${UBOOT_ENTRYPOINT}"
# Still reported: defaults with a value, in this file and in the class.
MY_LIST += "a"
MY_LIST ?= "default"
KERNEL_OTHER_ARGS += "b"
