# layer.conf variables keyed by collection name ("core" and "mine" are collections).
BBPATH .= ":${LAYERDIR}"
BBFILE_COLLECTIONS += "mine"
BBFILE_PATTERN_mine = "^${LAYERDIR}/"
BBFILE_PRIORITY_mine = "10"
LAYERDEPENDS_mine = "core"
LAYERSERIES_COMPAT_mine = "kirkstone scarthgap wrynose"
LAYERVERSION_mine = "1"
PREFERRED_PROVIDER_virtual/kernel = "linux-yocto"
