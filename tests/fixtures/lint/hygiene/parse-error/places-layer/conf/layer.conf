# hygiene/parse-error by place: true errors in metadata, none in data files.
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "places"
BBFILE_PATTERN_places = "^${LAYERDIR}/"
BBFILE_PRIORITY_places = "6"
LAYERSERIES_COMPAT_places = "wrynose"

# meta-oe's dynamic-layers/: no layer of the workspace is the collection `absent`.
BBFILES_DYNAMIC += " \
    absent:${LAYERDIR}/dynamic-layers/absent/recipes-*/*/*.bb \
    absent:${LAYERDIR}/dynamic-layers/absent/recipes-*/*/*.bbappend \
"
this line is not bitbake
