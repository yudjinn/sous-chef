BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "incompat"
BBFILE_PATTERN_incompat = "^${LAYERDIR}/"
BBFILE_PRIORITY_incompat = "6"

LAYERDEPENDS_incompat = "core"
LAYERSERIES_COMPAT_incompat = "dunfell scarthgapp"
