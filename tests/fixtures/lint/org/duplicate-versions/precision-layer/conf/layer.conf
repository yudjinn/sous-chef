BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# lint-precision: as meta-oe's conf/layer.conf (scarthgap) collects its selinux
# dynamic layer; no selinux collection is in the test workspace.
BBFILES_DYNAMIC += " \
    selinux:${LAYERDIR}/dynamic-layers/selinux/recipes-*/*/*.bb \
"

BBFILE_COLLECTIONS += "precision"
BBFILE_PATTERN_precision = "^${LAYERDIR}/"
BBFILE_PRIORITY_precision = "6"

LAYERSERIES_COMPAT_precision = "wrynose"
