# Release binaries (docs/releasing.md): on a tag v*, build sous-chef for Linux (x86_64,
# aarch64) and macOS (x86_64, aarch64), and attach one tarball per target and SHA256SUMS to
# a **draft** GitHub release named after the tag, with the tag's CHANGELOG.md section as its
# notes. The maintainer publishes the draft. Nothing else (no crates.io, no plugin
# publishing: the plugin installs from the repository's marketplace at the tag).
#
# workflow_dispatch is the dry run: the same builds, smoke tests, checksums and notes, kept
# as run artifacts; no release is created.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are built on Ubuntu 22.04, so they need glibc 2.35 or newer.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          # One Apple silicon runner builds both macOS targets (Xcode links either).
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Tag matches Cargo.toml
        # A tag v1.2.3 must release version 1.2.3: --version, the plugin manifest and the
        # changelog all follow Cargo.toml (tests/release_metadata.rs, plugin_packaging.rs).
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "Cargo.toml version: $version, tag: $GITHUB_REF_NAME"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Toolchain
        run: |
          rustup install
          rustup target add "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - name: Package
        id: package
        run: |
          name="sous-chef-${GITHUB_REF_NAME}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/sous-chef" LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          cat "dist/$name.tar.gz.sha256"
          tar -tzvf "dist/$name.tar.gz"
          echo "name=$name" >> "$GITHUB_OUTPUT"
        env:
          TARGET: ${{ matrix.target }}
      - name: Smoke test
        # Runs the binary from the tarball, not from target/. The x86_64 macOS binary is
        # built on an arm64 runner; Rosetta 2 runs it if the runner has it, else the
        # architecture is all that is checked.
        run: |
          mkdir smoke
          tar -C smoke -xzf "dist/$NAME.tar.gz"
          bin="smoke/$NAME/sous-chef"
          file "$bin"
          if [ "$TARGET" = x86_64-apple-darwin ] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "no Rosetta 2 on this runner: not run"
            file "$bin" | grep -q 'x86_64'
          else
            out=$("$bin" --version)
            echo "$out"
            test "$out" = "sous-chef $(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          fi
        env:
          NAME: ${{ steps.package.outputs.name }}
          TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          pattern: sous-chef-*
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          cat ./*.tar.gz.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 4
          cat SHA256SUMS
      - name: Release notes from CHANGELOG.md
        # The body of the "## [<version>] - <date>" section, up to the next "## " heading,
        # without the file's link reference definitions ("[0.1.0]: https://...").
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          awk -v h="## [$version] - " '
            index($0, h) == 1 { on = 1; next }
            on && /^## / { exit }
            on && /^\[[^]]*\]: / { next }
            on { print }
          ' CHANGELOG.md > dist/NOTES.md
          test -s dist/NOTES.md
          cat dist/NOTES.md
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: release-dry-run
          path: |
            dist/SHA256SUMS
            dist/NOTES.md
          if-no-files-found: error
      - name: Create the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --draft --title "sous-chef $GITHUB_REF_NAME" --notes-file dist/NOTES.md \
            dist/*.tar.gz dist/SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
